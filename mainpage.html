<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      img, video, svg, canvas { max-width: 100%; height: auto; }
      body { -webkit-text-size-adjust: 100%; }
    </style>
  </head>
  <body>
<!-- Boost.ai Chat Panel Script -->
<script src="https://daedalus.boost.ai/chatPanel/chatPanel.js"></script>
<script>
  var boost = window.boostInit("daedalus");
</script>

<!-- Chat Trigger Button -->
<button
  aria-label="Åpne chat"
  type="button"
  class="klara-chat-trigger"
  onclick="javascript:boost.chatPanel.show()"
>
  <img
    src="https://raw.githubusercontent.com/kboostj/skills-github-pages/refs/heads/main/Klara%20logo.jpg"
    alt="Klara"
    class="klara-chat-trigger__icon"
  />
  <span class="klara-chat-trigger__label">Chat med Klara</span>
</button>

<style>
  .klara-chat-trigger {
    display: flex;
    align-items: center;
    gap: 10px;
    background-color: #1189c9;
    border: none;
    border-radius: 50px;
    box-shadow: 0px 6px 20px rgba(17, 137, 201, 0.55);
    cursor: pointer;
    outline: none;
    padding: 6px 20px 6px 6px;
    position: fixed;
    bottom: 28px;
    right: 28px;
    transition: transform 200ms ease, box-shadow 200ms ease, background-color 200ms ease;
    z-index: 9999;
  }

  .klara-chat-trigger:hover {
    background-color: #0d72aa;
    box-shadow: 0px 8px 28px rgba(17, 137, 201, 0.7);
    transform: scale(1.04);
  }

  .klara-chat-trigger:active {
    transform: scale(0.97);
    box-shadow: 0px 4px 12px rgba(17, 137, 201, 0.5);
  }

  .klara-chat-trigger__icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    flex-shrink: 0;
  }

  .klara-chat-trigger__label {
    color: #ffffff;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
</style>
    </script>
  </body>
</html>
